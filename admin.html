<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VAPEBAZAR — Панель управления</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0d0d0f; color:#e8e8e8; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; min-height:100vh; padding:20px; }
  .header { text-align:center; padding:30px 0 24px; border-bottom:1px solid rgba(255,255,255,0.07); margin-bottom:28px; }
  .header h1 { font-size:22px; font-weight:900; letter-spacing:0.06em; color:#00f07c; }
  .header p { font-size:12px; color:rgba(255,255,255,0.35); margin-top:4px; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; max-width:600px; margin:0 auto; }
  .card { background:rgba(255,255,255,0.04); border:1px solid rgba(255,255,255,0.08); border-radius:16px; padding:20px; }
  .card h2 { font-size:13px; font-weight:700; color:rgba(255,255,255,0.5); letter-spacing:0.08em; text-transform:uppercase; margin-bottom:14px; }
  .btn { width:100%; padding:12px; border-radius:12px; border:none; font-family:inherit; font-size:13px; font-weight:700; cursor:pointer; transition:all 0.2s; margin-bottom:8px; display:flex; align-items:center; gap:8px; justify-content:center; }
  .btn-primary { background:rgba(0,240,124,0.15); border:1.5px solid rgba(0,240,124,0.4); color:#00f07c; }
  .btn-primary:hover { background:rgba(0,240,124,0.25); }
  .btn-secondary { background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.1); color:rgba(255,255,255,0.7); }
  .btn-secondary:hover { background:rgba(255,255,255,0.1); }
  .btn-danger { background:rgba(255,60,60,0.1); border:1px solid rgba(255,60,60,0.3); color:#ff6b6b; }
  .btn-danger:hover { background:rgba(255,60,60,0.2); }
  .btn:active { transform:scale(0.97); }
  .full { grid-column:1/-1; }
  textarea { width:100%; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:10px; padding:10px 12px; font-family:inherit; font-size:13px; color:#e8e8e8; resize:vertical; min-height:80px; margin-bottom:8px; }
  textarea::placeholder { color:rgba(255,255,255,0.25); }
  .status { font-size:12px; color:rgba(255,255,255,0.4); text-align:center; padding:8px; }
  .status.ok { color:#00f07c; }
  .status.err { color:#ff6b6b; }
  #log { background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.06); border-radius:10px; padding:12px; font-size:11px; color:rgba(255,255,255,0.5); max-height:160px; overflow-y:auto; white-space:pre-wrap; word-break:break-word; min-height:40px; font-family:'Menlo','Courier New',monospace; }
  .badge { display:inline-block; padding:3px 8px; border-radius:20px; font-size:10px; font-weight:700; }
  .badge-green { background:rgba(0,240,124,0.15); color:#00f07c; }
  .lock { text-align:center; padding:60px 20px; max-width:340px; margin:0 auto; }
  .lock input { width:100%; background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:12px; padding:12px 16px; font-family:inherit; font-size:14px; color:#e8e8e8; text-align:center; letter-spacing:2px; margin-bottom:12px; }
  .lock h2 { font-size:18px; font-weight:800; margin-bottom:8px; }
  .lock p { font-size:12px; color:rgba(255,255,255,0.35); margin-bottom:24px; }
  #app { display:none; }
</style>
</head>
<body>

<!-- Экран входа -->
<div id="lockScreen" class="lock">
  <div style="font-size:48px;margin-bottom:16px">🔐</div>
  <h2>VAPEBAZAR Admin</h2>
  <p>Введите пароль администратора</p>
  <input type="password" id="pwInput" placeholder="••••••••" onkeydown="if(event.key==='Enter')checkPw()">
  <button class="btn btn-primary" onclick="checkPw()">Войти</button>
  <div id="pwErr" class="status err" style="display:none">Неверный пароль</div>
</div>

<!-- Основной дашборд -->
<div id="app">
  <div class="header">
    <h1>💨 VAPEBAZAR ADMIN</h1>
    <p>Панель управления магазином · <span id="adminLabel"></span></p>
  </div>

  <div class="grid">

    <!-- Статистика -->
    <div class="card">
      <h2>📊 Статистика</h2>
      <button class="btn btn-primary" onclick="sendCmd('/stats')">📊 Выручка и заказы</button>
      <button class="btn btn-secondary" onclick="sendCmd('/orders')">📋 Последние заказы</button>
      <button class="btn btn-secondary" onclick="sendCmd('/top')">🏆 Топ товаров</button>
    </div>

    <!-- Экспорт и данные -->
    <div class="card">
      <h2>📁 Данные</h2>
      <button class="btn btn-primary" onclick="sendCmd('/export')">📥 Скачать CSV</button>
      <button class="btn btn-secondary" onclick="sendCmd('/bonus ' + prompt('Telegram ID клиента:'))">💎 Баллы клиента</button>
      <button class="btn btn-secondary" onclick="doRestockPrompt()">📦 Поступление товара</button>
    </div>

    <!-- Рассылка -->
    <div class="card full">
      <h2>📣 Рассылка</h2>
      <textarea id="broadcastText" placeholder="Текст рассылки… Поддерживает HTML: &lt;b&gt;жирный&lt;/b&gt;, &lt;i&gt;курсив&lt;/i&gt;"></textarea>
      <div style="display:flex;gap:8px">
        <button class="btn btn-primary" style="flex:1" onclick="doBroadcast('all')">📣 Всем подписчикам</button>
        <button class="btn btn-secondary" style="flex:1" onclick="doBroadcast('buyers')">🎯 Только покупателям</button>
      </div>
    </div>

    <!-- Лог -->
    <div class="card full">
      <h2>📟 Лог команд <span id="logStatus" class="badge badge-green" style="display:none">OK</span></h2>
      <div id="log">Нажми кнопку — результат придёт в Telegram. Здесь будет статус отправки.</div>
    </div>

  </div>
</div>

<script>
// ─── Конфиг (зеркало из script.js) ───────────────────────────────────────────
const TOKEN  = "8687110031:AAE9E430W55aRQQuUwDI8hEMjaVliq_gbG4";
const ADMINS = [6163521938, 5289357165];
const ADMIN_PASS = "boro2025";   // ← поменяй на свой пароль

// ─── Вход ────────────────────────────────────────────────────────────────────
function checkPw() {
  const val = document.getElementById('pwInput').value;
  if (val === ADMIN_PASS) {
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    document.getElementById('adminLabel').textContent = 'авторизован';
  } else {
    document.getElementById('pwErr').style.display = 'block';
    document.getElementById('pwInput').value = '';
  }
}

// ─── Отправка команды: открывает Telegram с готовой командой ─────────────────
function sendCmd(cmd) {
  if (!cmd || cmd === 'undefined' || cmd === 'null') return;
  openBotCmd(cmd);
}

const BOT_USERNAME = 'vapebazar_bot';

function doRestockPrompt() {
  const prod = prompt('Название товара (поступление):');
  if (prod) openBotCmd('/restock ' + prod);
}

async function doBroadcast(type) {
  const text = document.getElementById('broadcastText').value.trim();
  if (!text) { log('✗ Введи текст рассылки'); return; }
  const cmd = type === 'buyers' ? '/broadcast_buyers ' + text : '/broadcast ' + text;
  openBotCmd(cmd);
}

// Открывает Telegram с командой уже вписанной — остаётся только нажать «Отправить»
function openBotCmd(cmd) {
  log('→ Открываю Telegram: ' + cmd.slice(0, 40) + '…');
  const url = 'https://t.me/' + BOT_USERNAME + '?text=' + encodeURIComponent(cmd);
  window.open(url, '_blank');
}

// ─── UI helpers ───────────────────────────────────────────────────────────────
function log(msg) {
  const el = document.getElementById('log');
  const ts = new Date().toLocaleTimeString('ru-RU');
  el.textContent = `[${ts}] ${msg}\n` + el.textContent;
}
function showBadge(ok) {
  const b = document.getElementById('logStatus');
  b.style.display = 'inline-block';
  b.textContent = ok ? 'OK' : 'ERR';
  b.className = 'badge ' + (ok ? 'badge-green' : '');
  if (!ok) b.style.cssText += ';background:rgba(255,60,60,.15);color:#ff6b6b';
}
</script>
</body>
</html>
